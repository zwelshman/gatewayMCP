[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hdruk-gateway-mcp"
version = "0.1.0"
description = "MCP server for the Health Data Research UK (HDRUK) Gateway public API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Zach Welshman" }]
keywords = ["mcp", "hdruk", "health-data", "gateway", "nhs", "datasets"]
dependencies = [
    "fastmcp>=2.0",
    "httpx>=0.27",
]

[project.scripts]
hdruk-gateway-mcp = "hdruk_gateway_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["."]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "respx"]
